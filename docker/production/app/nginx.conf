# コンテナ内の nginx。ホストの nginx からリバースプロキシされる前提。
# TLS はホスト側で終端するので、ここでは扱わない。
# ホストが付ける X-Forwarded-* はそのまま php-fpm に渡り、Symfony の trusted_proxies
# （config/packages/framework.yaml の when@prod）で信頼する。

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile   on;
    tcp_nopush on;
    server_tokens off;

    # アップロードは無い。フォームの POST が通れば足りる
    client_max_body_size 1M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;

        charset utf-8;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        # 開発用の docker/nginx/default.conf と同じ。index.php だけを FastCGI に通す
        location ~ ^/index\.php(/|$) {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $realpath_root;
            internal;
        }

        location ~ \.php$ {
            return 404;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        # ドットファイルは配信しない
        location ~ /\. {
            deny all;
        }
    }
}
