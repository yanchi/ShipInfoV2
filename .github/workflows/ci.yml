name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  php-tests:
    name: PHPUnit
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      APP_SECRET: ci-secret
      APP_SHARE_DIR: var/share
      DEFAULT_URI: http://localhost
      # テスト環境では doctrine.yaml の dbname_suffix で shipinfo_test に繋がる
      DATABASE_URL: mysql://root:password@127.0.0.1:3306/shipinfo?serverVersion=8.0&charset=utf8mb4

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: shipinfo_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl
          coverage: none
          # ローカル（docker/php/php.ini）と同じ日本時間にする。setup-php の初期値は UTC
          ini-values: date.timezone=Asia/Tokyo

      # .env は git 管理外だが bootEnv が読むので空で作っておく（値は上の env で渡す）
      - name: Create .env
        working-directory: app
        run: touch .env

      - name: Install Composer dependencies
        working-directory: app
        run: composer install --no-interaction --prefer-dist

      - name: Check code style (PHP-CS-Fixer)
        working-directory: app
        run: vendor/bin/php-cs-fixer check --diff

      # ローカル（docker-compose.yml の --default-time-zone）と同じ日本時間にする。
      # サービスコンテナは command を変えられないので、ここで設定する（以降の接続から効く）
      - name: Set MySQL time zone
        run: mysql -h127.0.0.1 -uroot -ppassword -e "SET GLOBAL time_zone = '+09:00';"

      # 最初のマイグレーションは 01_schema.sql のテーブルを ALTER するので、先にスキーマを流す（Makefile の init-test-db と同じ）
      - name: Load base schema
        run: mysql -h127.0.0.1 -uroot -ppassword shipinfo_test < docker/mysql/init/01_schema.sql

      - name: Run migrations
        working-directory: app
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Lint Twig, YAML and DI container
        working-directory: app
        run: |
          php bin/console lint:twig templates
          php bin/console lint:yaml config --parse-tags
          php bin/console lint:container

      # マイグレーション後の DB とエンティティのマッピングがずれていないか（マイグレーションの作り忘れを拾う）
      - name: Validate Doctrine schema
        working-directory: app
        run: php bin/console doctrine:schema:validate

      - name: Run PHPUnit
        working-directory: app
        run: php bin/phpunit

  python-tests:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scraper/requirements*.txt

      # mysqlclient のビルドに必要
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends default-libmysqlclient-dev pkg-config

      - name: Install dependencies
        working-directory: scraper
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        working-directory: scraper
        run: |
          ruff check scraper/ tests/
          ruff format --check scraper/ tests/

      - name: Run pytest
        working-directory: scraper
        run: python -m pytest tests/ -v

  # 依存パッケージの既知の脆弱性。新しい脆弱性は Dependabot（.github/dependabot.yml）でも知らせる
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Audit Composer dependencies
        working-directory: app
        run: composer audit --locked

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Audit pip dependencies
        working-directory: scraper
        run: |
          pip install pip-audit==2.10.1
          pip-audit -r requirements.txt -r requirements-dev.txt
