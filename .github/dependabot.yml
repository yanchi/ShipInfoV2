# 依存パッケージの更新とセキュリティ修正の PR を Dependabot が作る
version: 2
updates:
  - package-ecosystem: composer
    directory: /app
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    groups:
      # Symfony は 7.4.* でそろえて上げる
      symfony:
        patterns: ["symfony/*"]
      twig:
        patterns: ["twig/*"]
      doctrine:
        patterns: ["doctrine/*"]
    ignore:
      # Symfony は 7.4 LTS で止める（8.x へは計画して上げる。CLAUDE.md の「Symfony 7.4 LTS」）。
      # Dependabot は composer.json の 7.4.* も書き換えて 8.x の PR を作るので、メジャーは無視する
      - dependency-name: "symfony/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: pip
    directory: /scraper
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    groups:
      dev:
        patterns: ["pytest*", "ruff", "mypy", "responses", "pip-audit"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      timezone: Asia/Tokyo

  # 本番イメージの PHP（パッチ版まで固定している）。セキュリティ修正の版を取りこぼさないように毎週見る
  - package-ecosystem: docker
    directory: /docker/production/app
    schedule:
      interval: weekly
      timezone: Asia/Tokyo
    ignore:
      # 8.3 系のまま上げる（マイナー以上は計画して上げる）
      - dependency-name: "php"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
