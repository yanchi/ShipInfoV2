# ホストの nginx の vhost。/etc/nginx/sites-enabled/shipinfo-v2.conf に置く。
# 既存の shipinfo.conf・keiei-copilot.conf と同じ流儀（127.0.0.1 へのプロキシ）。
#
# 旧 ShipInfo（ship.isl-mentor.com → 127.0.0.1:8080）と並べて動かす間は v2.ship.isl-mentor.com で出す。
# 置き換えるときの手順は deploy/README.md の「旧 ShipInfo からの切り替え」。
#
# 手順:
#   1. DOMAIN を v2.ship.isl-mentor.com に置き換えて配置する
#   2. sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot --nginx -d DOMAIN
#      → certbot が 443 のブロックと HTTP→HTTPS のリダイレクトを追記する

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # 旧 ShipInfo と並べている間の V2 は検索エンジンに載せない（本番は ship.isl-mentor.com）。
    # robots.txt で Disallow にはしない。クローラーがページを読めずこのヘッダーに気づかないので、
    # よそからリンクされると URL だけ載ってしまう。クロールは許したまま noindex にする。
    # server に書くのは、certbot が 443 の server を作るときにこのブロックを写すから（location に書くと
    # 子の add_header で消えうる）。切り替えで ship.isl-mentor.com に移るときはこの vhost を使わないので、自然に外れる
    add_header X-Robots-Tag "noindex, nofollow" always;

    # certbot の HTTP-01 チャレンジはアプリに流さずホストで返す
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        # compose.prod.yml の APP_PORT と揃える
        proxy_pass         http://127.0.0.1:8002;
        proxy_http_version 1.1;

        # X-Forwarded-Proto が無いと、アプリは http で受けたと思い込む。
        # /ports の「この港を保存」（stateless CSRF）は Origin（https）と比べるので、黙って保存されなくなる
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }
}
